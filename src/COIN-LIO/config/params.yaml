common:
    time_sync_en: false         # ONLY turn on when external time synchronization is really not possible

preprocess:
    lidar_type: 3                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
    scan_line: 128
    blind: 0.65                  # 输入点云最小距离截断(米): 太近的点丢弃(盲区)
    max_range: 80.0              # 输入点云最大距离截断(米): 超过该距离的点丢弃; 设为 0 或负数表示不限制
    timestamp_unit: 3

mapping:
    point_filter_num: 4
    filter_size_surf: 0.5
    filter_size_map: 0.5
    cube_side_length: 1000
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree:    180
    det_range:     150
    extrinsic_est_en:  false      # true: enable the online estimation of IMU-LiDAR extrinsic
    extrinsic_T: [-0.00625, 0.011775, 0.028535]
    extrinsic_R: [1, 0, 0,
                  0, 1, 0,
                  0, 0, 1]
publish:
    path_en:  true               # true: 发布 /path (机器人轨迹), 才能在 rviz 里显示
    scan_publish_en:  true       # false: close all the point cloud output
    dense_publish_en: false       # false: low down the points number in a global-frame point clouds scan.
    scan_bodyframe_pub_en: true  # true: output the point cloud scans in IMU-body-frame
    dashboard: true
    debug: false

robotpose:
    csv_en:  true                # 退出时是否把机器人位姿(每帧)写成 csv
    csv_file: "/home/yyh/study_files/Compare_deeppvslam/src/COIN-LIO/Robotpose/1018_13.csv"   # 位姿 csv 输出路径: 完整 .csv 文件名, 或写成目录(则该目录下生成 robot_pose.csv)

pcd_save:
    pcd_save_en: false
    interval: -1                 # how many LiDAR frames saved in each pcd file;
                                 # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.

filter:
    max_iteration: 5
    photo_scale: 0.00095

image:
    patch_size: 5
    max_range: 30
    max_lifetime: 25
    min_range: 0.7
    suppression_radius: 10
    num_features: 60
    grad_min: 16.5
    ncc_threshold: 0.7075
    margin: 10
    intensity_scale: 0.25
    window: [41, 7]
    masks: [0, 84, 70, 44, 953, 84, 70, 44]